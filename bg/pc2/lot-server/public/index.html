<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>세척·패킹</title>
    <link rel="stylesheet" href="/station.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="queue-total" id="queueTotal">—건</div>
      <div class="diameters" id="diameters" aria-label="직경별 건수"></div>
      <div class="toolbar">
        <button type="button" id="vialBtn">공병 라벨</button>
        <button type="button" id="packingBtn">패킹 라벨</button>
        <button type="button" id="screwBtn">스크류 로트번호</button>
      </div>
    </header>

    <main class="main">
      <section class="station">
        <div class="station-top">
          <div class="row">
            <span class="label">감시</span>
            <span class="muted" id="watchStatus">중지</span>
            <button type="button" class="btn btn-dark" id="startWatch">시작</button>
            <button type="button" class="btn" id="stopWatch" hidden>종료</button>
            <button type="button" class="btn" id="focusBtn">초점</button>
            <button type="button" class="btn" id="recognizeBtn">수동 인식</button>
            <label class="label" for="device">카메라</label>
            <select id="device" class="btn"></select>
            <button type="button" class="btn" id="refreshDevices">목록</button>
          </div>
          <div class="row">
            <span class="label">각인 코드</span>
            <div class="suffix" id="suffix" aria-label="선택된 각인 코드">—</div>
            <button type="button" class="btn btn-primary" id="matchBtn">매칭</button>
            <button type="button" class="btn" id="printMatchedBtn">프린트</button>
            <p class="note" id="matchNote"></p>
          </div>
        </div>
        <div class="live-wrap">
          <div class="live-box">
            <img id="live" alt="현미경 라이브" hidden />
            <p id="liveEmpty">감시 시작을 누르면 라이브가 표시됩니다.</p>
          </div>
        </div>
      </section>

      <aside class="strip" id="requestStrip" aria-label="세척·패킹 대기 의뢰"></aside>
    </main>

    <div class="history" id="history" aria-live="polite"></div>

    <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true">
      <div class="modal">
        <div class="row" style="justify-content: space-between; margin-bottom: 0.35rem">
          <h2 id="modalTitle">설정</h2>
          <button type="button" class="btn" id="modalClose">닫기</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="/vendor/qrcode.js"></script>
    <script src="/vialLabel.js"></script>
    <script src="/packLabel.js"></script>
    <script src="/station.js"></script>
  </body>
</html>
